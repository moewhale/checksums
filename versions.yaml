# versions.yaml — 软件版本清单（唯一真实来源）
# 修改 version 字段后提交，GitHub Actions 会自动刷新 dist/checksums.*
# 也可本地执行: ./tools/fetch-checksums.sh --update
meta:
  updated: "2026-08-31"
  maintainer: "checkmd5-bot"
  description: "Tracked upstream packages for SHA256 supply-chain verification"
packages:
  nginx:
    version: "1.31.4"
    filename: "nginx-{version}.tar.gz"
    url: "https://nginx.org/download/nginx-{version}.tar.gz"
    mirrors:
      - "https://mirrors.aliyun.com/nginx/nginx-{version}.tar.gz"
    algo: "sha256"
  php:
    version: "8.5.10"
    filename: "php-{version}.tar.bz2"
    url: "https://www.php.net/distributions/php-{version}.tar.bz2"
    algo: "sha256"
  mariadb:
    version: "11.8.9"
    filename: "mariadb-{version}.tar.gz"
    binary_filename: "mariadb-{version}-linux-systemd-x86_64.tar.gz"
    url: "https://archive.mariadb.org/mariadb-{version}/source/mariadb-{version}.tar.gz"
    binary_url: "https://archive.mariadb.org/mariadb-{version}/bintar-linux-systemd-x86_64/mariadb-{version}-linux-systemd-x86_64.tar.gz"
    mirrors: []
    algo: "sha256"
  postgresql:
    version: "18.6"
    filename: "postgresql-{version}.tar.gz"
    url: "https://ftp.postgresql.org/pub/source/v{version}/postgresql-{version}.tar.gz"
    algo: "sha256"
  openssl:
    version: "3.5.5"
    filename: "openssl-{version}.tar.gz"
    url: "https://www.openssl.org/source/openssl-{version}.tar.gz"
    algo: "sha256"
  openssl-compat:
    version: "1.1.1w"
    filename: "openssl-{version}.tar.gz"
    url: "https://www.openssl.org/source/old/1.1.1/openssl-{version}.tar.gz"
    algo: "sha256"
  pcre:
    version: "8.45"
    filename: "pcre-{version}.tar.bz2"
    url: "https://sourceforge.net/projects/pcre/files/pcre/{version}/pcre-{version}.tar.bz2/download"
    algo: "sha256"
  jemalloc:
    version: "5.3.0"
    filename: "jemalloc-{version}.tar.bz2"
    url: "https://github.com/jemalloc/jemalloc/releases/download/{version}/jemalloc-{version}.tar.bz2"
    algo: "sha256"
  redis:
    version: "8.10.0"
    filename: "redis-{version}.tar.gz"
    url: "https://download.redis.io/releases/redis-{version}.tar.gz"
    algo: "sha256"
  phpMyAdmin:
    version: "5.2.3"
    filename: "phpMyAdmin-{version}-all-languages.tar.xz"
    url: "https://files.phpmyadmin.net/phpMyAdmin/{version}/phpMyAdmin-{version}-all-languages.tar.xz"
    algo: "sha256"
  libiconv:
    version: "1.18"
    filename: "libiconv-{version}.tar.gz"
    url: "https://ftp.gnu.org/gnu/libiconv/libiconv-{version}.tar.gz"
    algo: "sha256"
  freetype:
    version: "2.13.0"
    filename: "freetype-{version}.tar.xz"
    url: "https://download.savannah.gnu.org/releases/freetype/freetype-{version}.tar.xz"
    algo: "sha256"
